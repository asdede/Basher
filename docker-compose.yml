services:

  ollama:
    build:
      context: ./dockerfiles
      dockerfile: Dockerfile.LLM
    container_name: basher-llm
    environment:
      # Pulled by entrypoint-ollama.sh on first start. Keep in sync with
      # OLLAMA_MODEL on the api service so the model the API asks for is
      # actually present in the LLM container.
      # Tool-capable Qwen (Ollama capabilities include "tools"). 3–7B class.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qdrant:
    build:
      context: ./dockerfiles
      dockerfile: Dockerfile.db
    container_name: basher-db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.API
    container_name: basher-api
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # Must match the ollama service's OLLAMA_MODEL or the api will ask
      # for a model the LLM container never pulled (HTTP 404 from Ollama).
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:4b}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-12288}
      QDRANT_URL: http://qdrant:6333
      DOCPAGES_CONFIG: /app/config/docPages.json
    ports:
      - "8000:8000"
    volumes:
      - ./eval/results:/app/eval/results
      # Host Fedora quick-docs (and any local HTML) for ingest inside the API
      # container: python -m src.db.init --only fedora_quick_docs
      # Fetch with: ./Scripts/fetch-fedora-docs.sh
      - ./docs:/app/docs:ro
    depends_on:
      - ollama
      - qdrant
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data: