services:

  ollama:
    build:
      context: ./dockerfiles
      dockerfile: Dockerfile.LLM
    container_name: basher-llm
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  qdrant:
    build:
      context: ./dockerfiles
      dockerfile: Dockerfile.db
    container_name: basher-db
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.API
    container_name: basher-api
    ports:
      - "8000:8000"
    volumes:
      - ./eval/results:/app/eval/results
    depends_on:
      - ollama
      - qdrant
    restart: unless-stopped

volumes:
  ollama_data:
  qdrant_data: